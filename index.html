<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16803c"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Préstamo Personal</title>
<style>
:root{--g:#16803c;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#222}
header{background:var(--g);color:#fff;padding:22px 18px calc(18px + env(safe-area-inset-top));font-size:24px;font-weight:800}
main{max-width:650px;margin:auto;padding:16px 14px 40px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #00000012}
label{display:block;font-weight:700;margin:10px 0 6px}input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
button{width:100%;padding:13px;border:0;border-radius:11px;font-size:16px;font-weight:700;margin-top:10px}.green{background:var(--g);color:#fff}.gray{background:#e9ecef}.wa{background:#25d366;color:#fff}.danger{background:#fce8e8;color:#a00}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#f6f7f8;padding:12px;border-radius:11px}.stat b{display:block;font-size:19px;margin-top:4px}.saldo{grid-column:1/-1}
#clientes button{margin-top:7px;text-align:left}.cliente{background:#f8f9fa;border:1px solid #e4e6e8;color:#222}.muted{color:#666;font-size:13px}
table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:9px 4px;border-bottom:1px solid #eee;text-align:left;font-size:14px}
.hidden{display:none}.title{font-size:19px;font-weight:800}.back{margin-bottom:10px}.empty{text-align:center;color:#777;padding:15px}
@media print{body{background:#fff}header,main>*:not(#recibo){display:none!important}#recibo{display:block!important;margin:20px}.no-print{display:none!important}}
</style></head>
<body>
<header>PRÉSTAMO PERSONAL</header>
<main>
<section id="inicio">
<div class="card">
<div class="title">Nuevo préstamo</div>
<label>Nombre del cliente</label><input id="nombre" placeholder="Nombre completo">
<label>Total a pagar</label><input id="total" type="number" step="0.01" placeholder="0.00">
<button class="green" onclick="crear()">Guardar préstamo</button>
</div>
<div class="card"><div class="title">Mis clientes</div><div id="clientes"></div></div>
</section>

<section id="detalle" class="hidden">
<button class="gray back" onclick="mostrarInicio()">← Volver a clientes</button>
<div class="card">
<div class="title" id="dNombre"></div>
<div class="stats">
<div class="stat">Total a pagar<b id="dTotal"></b></div>
<div class="stat">Total abonado<b id="dAbonado"></b></div>
<div class="stat saldo">Saldo pendiente<b id="dSaldo"></b></div>
</div>
<label>Monto del abono</label><input id="monto" type="number" step="0.01" placeholder="0.00">
<button class="green" onclick="abonar()">Registrar abono</button>
<button class="gray" onclick="comprobante()">Generar comprobante PDF</button>
<button class="wa" onclick="whatsapp()">Compartir por WhatsApp</button>
<button class="danger" onclick="eliminar()">Eliminar cliente</button>
</div>
<div class="card"><div class="title">Historial de abonos</div><div id="hist"></div></div>
</section>

<section id="recibo" class="hidden"></section>
</main>
<script>
const KEY="pp_clientes_v2";let clientes=JSON.parse(localStorage.getItem(KEY)||"[]"),actual=null;
const money=n=>"$"+Number(n).toFixed(2);
const fecha=()=>new Date().toLocaleDateString("es-SV",{day:"2-digit",month:"2-digit",year:"numeric"});
function save(){localStorage.setItem(KEY,JSON.stringify(clientes))}
function crear(){
 let n=document.getElementById("nombre").value.trim(),t=Number(document.getElementById("total").value);
 if(!n||t<=0)return alert("Completa el nombre y el total a pagar.");
 let c={id:Date.now(),nombre:n,total:t,abonado:0,abonos:[]};clientes.push(c);save();
 document.getElementById("nombre").value="";document.getElementById("total").value="";abrir(c.id);
}
function mostrarInicio(){document.getElementById("inicio").classList.remove("hidden");document.getElementById("detalle").classList.add("hidden");document.getElementById("recibo").classList.add("hidden");renderClientes()}
function renderClientes(){
 let el=document.getElementById("clientes");if(!clientes.length){el.innerHTML='<div class="empty">Aún no hay clientes.</div>';return}
 el.innerHTML=clientes.map(c=>`<button class="cliente" onclick="abrir(${c.id})"><b>${esc(c.nombre)}</b><br><span class="muted">Saldo: ${money(c.total-c.abonado)}</span></button>`).join("")
}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function abrir(id){
 actual=clientes.find(c=>c.id===id);if(!actual)return;
 document.getElementById("inicio").classList.add("hidden");document.getElementById("detalle").classList.remove("hidden");document.getElementById("recibo").classList.add("hidden");
 document.getElementById("dNombre").textContent=actual.nombre;document.getElementById("dTotal").textContent=money(actual.total);
 document.getElementById("dAbonado").textContent=money(actual.abonado);document.getElementById("dSaldo").textContent=money(Math.max(0,actual.total-actual.abonado));
 document.getElementById("monto").value="";renderHist();
}
function abonar(){
 let m=Number(document.getElementById("monto").value),saldo=actual.total-actual.abonado;
 if(m<=0)return alert("Ingresa un monto válido.");if(m>saldo)return alert("El abono no puede superar el saldo pendiente.");
 actual.abonado+=m;actual.abonos.push({fecha:fecha(),monto:m});save();abrir(actual.id);alert("Abono registrado correctamente.");
}
function renderHist(){
 let h=document.getElementById("hist");if(!actual.abonos.length){h.innerHTML='<div class="empty">Sin abonos registrados.</div>';return}
 h.innerHTML='<table><tr><th>Fecha</th><th>Abono</th></tr>'+actual.abonos.slice().reverse().map(a=>`<tr><td>${a.fecha}</td><td>${money(a.monto)}</td></tr>`).join("")+'</table>';
}
function textoRecibo(){
 let a=actual.abonos[actual.abonos.length-1];return `<div class="card"><div style="text-align:center"><h2>PRÉSTAMO PERSONAL</h2><b>COMPROBANTE DE ABONO</b><hr></div>
<p><b>Nombre:</b> ${esc(actual.nombre)}</p><p><b>Fecha:</b> ${a.fecha}</p><p><b>Monto abonado:</b> ${money(a.monto)}</p><p><b>Total abonado:</b> ${money(actual.abonado)}</p><p style="font-size:20px"><b>Saldo pendiente:</b> ${money(actual.total-actual.abonado)}</p><hr><p style="text-align:center">Comprobante de pago</p></div>`}
function comprobante(){
 if(!actual.abonos.length)return alert("Registra primero un abono.");
 document.getElementById("recibo").innerHTML=textoRecibo();document.getElementById("recibo").classList.remove("hidden");window.print();
}
function whatsapp(){
 if(!actual.abonos.length)return alert("Registra primero un abono.");
 let a=actual.abonos[actual.abonos.length-1],s=actual.total-actual.abonado;
 let txt=`PRÉSTAMO PERSONAL\n\nCliente: ${actual.nombre}\nFecha: ${a.fecha}\nAbono: ${money(a.monto)}\nTotal abonado: ${money(actual.abonado)}\nSaldo pendiente: ${money(s)}`;
 location.href="https://wa.me/?text="+encodeURIComponent(txt);
}
function eliminar(){
 if(confirm("¿Eliminar este cliente y todo su historial?")){clientes=clientes.filter(c=>c.id!==actual.id);save();actual=null;mostrarInicio()}
}
renderClientes();
</script></body></html>
