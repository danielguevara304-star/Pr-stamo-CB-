<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#159447">
<title>Calculadora de Préstamos</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7f5;color:#17301f}
header{background:#159447;color:white;padding:22px 18px;border-radius:0 0 22px 22px;box-shadow:0 3px 12px #0002}
h1{margin:0;font-size:25px} header p{margin:5px 0 0;opacity:.9}
main{padding:16px;max-width:650px;margin:auto}.card{background:white;border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 2px 10px #00000012}
label{display:block;font-weight:650;margin:11px 0 6px}input,select,button{width:100%;padding:13px;border-radius:11px;border:1px solid #ccd7d0;font-size:16px;background:white}
button{border:0;background:#159447;color:white;font-weight:700;margin-top:14px}.secondary{background:#e7f4ec;color:#126d36}.danger{background:#ffe9e9;color:#b42318}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{font-size:17px;padding:10px 0;border-bottom:1px solid #edf0ee}.result:last-child{border:0}.big{font-size:27px;font-weight:800;color:#159447}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 5px;border-bottom:1px solid #e5e9e6;text-align:right}th:first-child,td:first-child{text-align:left}
.small{font-size:13px;color:#65746a}.hidden{display:none}.payment{padding:12px 0;border-bottom:1px solid #eee}
</style>
</head>
<body>
<header><h1>Calculadora de Préstamos</h1><p>Calcula intereses, cuotas y saldo pendiente</p></header>
<main>
<div class="card">
<h2>Datos del préstamo</h2>
<label>Cliente (opcional)</label><input id="cliente" placeholder="Nombre del cliente">
<div class="grid">
<div><label>Monto</label><input id="monto" type="number" step="0.01" placeholder="500"></div>
<div><label>Tasa mensual (%)</label><input id="tasa" type="number" step="0.01" placeholder="6"></div>
</div>
<div class="grid">
<div><label>Plazo</label><input id="plazo" type="number" step="1" placeholder="3"></div>
<div><label>Frecuencia</label><select id="frecuencia"><option value="mensual">Mensual</option><option value="quincenal">Quincenal</option><option value="semanal">Semanal</option><option value="diaria">Diaria</option></select></div>
</div>
<label>Método de interés</label>
<select id="metodo"><option value="simple">Interés simple (tasa sobre capital)</option><option value="compuesto">Interés compuesto</option></select>
<button onclick="calcular()">Calcular préstamo</button>
</div>

<div id="resultado" class="card hidden">
<h2>Resultado</h2>
<div class="result">Interés total <span class="big" id="interes"></span></div>
<div class="result">Total a pagar <span class="big" id="total"></span></div>
<div class="result">Cuota <strong id="cuota"></strong></div>
<div class="result">Número de cuotas <strong id="ncuotas"></strong></div>
<p class="small" id="detalle"></p>
<button class="secondary" onclick="guardar()">Guardar cálculo</button>
</div>

<div class="card">
<h2>Abonos</h2>
<p class="small">Después de calcular, registra cada pago para llevar el saldo.</p>
<div class="grid"><div><label>Fecha</label><input id="fecha" type="date"></div><div><label>Monto abonado</label><input id="abono" type="number" step="0.01"></div></div>
<button onclick="registrarAbono()">Registrar abono</button>
<div id="saldoBox" class="hidden" style="margin-top:15px"><div class="result">Saldo pendiente <span class="big" id="saldo"></span></div><div id="historial"></div></div>
</div>

<div class="card">
<h2>Interés moratorio</h2>
<div class="grid"><div><label>Saldo vencido</label><input id="vencido" type="number" step="0.01"></div><div><label>Mora mensual (%)</label><input id="moratasa" type="number" step="0.01"></div></div>
<label>Días de atraso</label><input id="dias" type="number" step="1">
<button onclick="calcularMora()">Calcular mora</button>
<div id="moraResult" class="result hidden"></div>
</div>
</main>
<script>
let prestamo={total:0,abonos:[]};
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);
function calcular(){
 const m=+monto.value||0,t=+tasa.value||0,p=+plazo.value||0, f=frecuencia.value;
 if(!m||!p){alert("Ingresa monto y plazo.");return}
 let meses=p, n=p, diasTotales=p*30;
 if(f==="quincenal"){n=p*2;meses=p;diasTotales=p*30} if(f==="semanal"){n=p*4;meses=p;diasTotales=p*30} if(f==="diaria"){n=p*30;meses=p;diasTotales=p*30}
 let total,interes;
 if(metodo.value==="simple"){interes=m*(t/100)*meses;total=m+interes}
 else {total=m*Math.pow(1+t/100,meses);interes=total-m}
 const cuota=total/n;
 prestamo={cliente:cliente.value,monto:m,tasa:t,plazo:p,frecuencia:f,total,interes,cuota,ncuotas:Math.ceil(n),abonos:[]};
 document.getElementById("resultado").classList.remove("hidden");
 interesEl= document.getElementById("interes"); interesEl.textContent=money(interes);
 document.getElementById("total").textContent=money(total);
 document.getElementById("cuota").textContent=money(cuota);
 document.getElementById("ncuotas").textContent=Math.ceil(n);
 document.getElementById("detalle").textContent=`Método: ${metodo.value==="simple"?"interés simple":"interés compuesto"} · ${f} · ${diasTotales} días en el plazo`;
 actualizarSaldo();
}
function registrarAbono(){
 if(!prestamo.total){alert("Primero calcula un préstamo.");return}
 const a=+abono.value||0;if(a<=0){alert("Ingresa un abono válido.");return}
 prestamo.abonos.push({fecha:fecha.value||new Date().toISOString().slice(0,10),monto:a});
 abono.value="";actualizarSaldo();
}
function actualizarSaldo(){
 if(!prestamo.total)return;
 const pagado=prestamo.abonos.reduce((s,x)=>s+x.monto,0), saldo=Math.max(0,prestamo.total-pagado);
 document.getElementById("saldoBox").classList.remove("hidden");document.getElementById("saldo").textContent=money(saldo);
 historial.innerHTML=prestamo.abonos.length?prestamo.abonos.map((x,i)=>`<div class="payment">${x.fecha} — <strong>${money(x.monto)}</strong> <button class="danger" style="width:auto;padding:7px 10px;margin:0;float:right" onclick="eliminarAbono(${i})">Eliminar</button></div>`).join(""):"Sin abonos registrados";
}
function eliminarAbono(i){prestamo.abonos.splice(i,1);actualizarSaldo()}
function calcularMora(){
 const s=+vencido.value||0,r=+moratasa.value||0,d=+dias.value||0;
 const mora=s*(r/100)*(d/30);moraResult.classList.remove("hidden");moraResult.innerHTML=`Mora estimada: <strong>${money(mora)}</strong><br>Total con mora: <strong>${money(s+mora)}</strong>`;
}
function guardar(){
 localStorage.setItem("calculadoraPrestamo",JSON.stringify(prestamo));alert("Cálculo guardado en este dispositivo.");
}
fecha.value=new Date().toISOString().slice(0,10);
</script>
</body></html>
